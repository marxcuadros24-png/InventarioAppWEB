<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Inventario Institucional">
    <meta name="theme-color" content="#6366f1">
    <title>Inventario Institucional</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/assets/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/modal-styles.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader"></div>
        <p>Cargando...</p>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <img src="/assets/logo-iest.png" alt="IEST César A. Guardia Mayorga" class="login-logo">
                    <h1>Sistema de Inventario</h1>
                    <p>IEST "César A. Guardia Mayorga" - Coracora</p>
                </div>

                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Iniciar Sesión
                    </button>

                    <div id="login-error" class="error-message hidden"></div>
                </form>

                <div class="offline-indicator hidden" id="offline-login">
                    <span>⚠️ Sin conexión - Modo offline</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="/assets/logo-iest.png" alt="IEST" class="sidebar-logo">
                <div class="sidebar-title">
                    <h2>Inventario</h2>
                    <p>IEST Coracora</p>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
            </div>

            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="#bienes" class="nav-item" data-view="bienes">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Bienes</span>
                </a>
                <a href="#catalogos" class="nav-item" data-view="catalogos">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">Catálogos</span>
                </a>
                <a href="#responsables" class="nav-item" data-view="responsables">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Responsables</span>
                </a>
                <a href="#movimientos" class="nav-item" data-view="movimientos">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-text">Movimientos</span>
                </a>
                <a href="#usuarios" class="nav-item" data-view="usuarios">
                    <span class="nav-icon">🔐</span>
                    <span class="nav-text">Usuarios</span>
                </a>
                <a href="#auditoria" class="nav-item" data-view="auditoria">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Auditoría</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info" id="user-info">
                    <span class="user-icon">👤</span>
                    <span class="user-name">Usuario</span>
                </div>
                <button class="btn btn-secondary btn-sm" id="logout-btn">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>
                    <h1 id="page-title">Dashboard</h1>
                </div>

                <div class="header-right">
                    <div class="connection-status" id="connection-status">
                        <span class="status-dot online"></span>
                        <span class="status-text">Online</span>
                    </div>

                    <div class="sync-status hidden" id="sync-status">
                        <span class="sync-icon">🔄</span>
                        <span class="sync-text">Sincronizando...</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content" id="content">
                <!-- Views will be loaded here dynamically -->
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Scripts -->
    <!-- QR and PDF Libraries (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- App Scripts -->
    <script src="/js/db.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sync.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/qr-generator.js"></script>
    <script src="/js/app.js"></script>

            });
        }
    </script>
    -->
</body>

</html>
